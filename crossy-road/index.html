<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossy Road Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #gameCanvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            color: white;
        }
        #gameOver h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
            color: #ff4444;
        }
        #gameOver p {
            font-size: 24px;
            margin: 10px 0;
        }
        #restartBtn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 24px;
            background: #44ff44;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        #restartBtn:hover {
            background: #66ff66;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
    </div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">RESTART</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game constants
        const LANE_WIDTH = 2;
        const GRID_SIZE = 2;
        const MOVE_DURATION = 0.2;
        const HOP_HEIGHT = 0.5;
        const VIEW_DISTANCE = 20;
        const CAMERA_OFFSET = 15;

        // Lane types
        const LANE_TYPES = {
            GRASS: 'grass',
            ROAD: 'road',
            RIVER: 'river'
        };

        // Game state
        let scene, camera, renderer;
        let player;
        let lanes = [];
        let obstacles = [];
        let trees = []; // Store tree positions for collision
        let gameActive = true;
        let score = 0;
        let maxZ = 0;
        let isMoving = false;
        let moveProgress = 0;
        let moveStart = { x: 0, y: 0, z: 0 };
        let moveEnd = { x: 0, y: 0, z: 0 };
        let ridingLog = null;

        // Initialize Three.js
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 30, 60);

            // Camera (Orthographic for isometric view)
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 8;
            camera = new THREE.OrthographicCamera(
                -viewSize * aspect, viewSize * aspect,
                viewSize, -viewSize,
                0.1, 1000
            );
            camera.position.set(-15, 15, -15);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.camera.left = -30;
            directionalLight.shadow.camera.right = 30;
            directionalLight.shadow.camera.top = 30;
            directionalLight.shadow.camera.bottom = -30;
            scene.add(directionalLight);

            // Create player
            createPlayer();

            // Generate initial lanes
            for (let z = -10; z <= 10; z++) {
                generateLane(z * LANE_WIDTH);
            }

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.getElementById('restartBtn').addEventListener('click', restartGame);

            animate();
        }

        function createPlayer() {
            // Create chicken as a group of boxes
            player = new THREE.Group();
            
            const whiteMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const orangeMaterial = new THREE.MeshLambertMaterial({ color: 0xff8800 });
            const magentaMaterial = new THREE.MeshLambertMaterial({ color: 0xff1493 });
            const blackMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            
            // Main body (white box)
            const bodyGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.7);
            const body = new THREE.Mesh(bodyGeometry, whiteMaterial);
            body.position.set(0, 0.3, 0);
            body.castShadow = true;
            player.add(body);
            
            // Head (smaller white box on top)
            const headGeometry = new THREE.BoxGeometry(0.5, 0.4, 0.5);
            const head = new THREE.Mesh(headGeometry, whiteMaterial);
            head.position.set(0, 0.7, 0.05);
            head.castShadow = true;
            player.add(head);
            
            // Comb (magenta box on top of head)
            const combGeometry = new THREE.BoxGeometry(0.25, 0.2, 0.15);
            const comb = new THREE.Mesh(combGeometry, magentaMaterial);
            comb.position.set(0, 0.95, 0);
            comb.castShadow = true;
            player.add(comb);
            
            // Beak (small orange box on front of head)
            const beakGeometry = new THREE.BoxGeometry(0.15, 0.15, 0.2);
            const beak = new THREE.Mesh(beakGeometry, orangeMaterial);
            beak.position.set(0, 0.65, 0.35);
            beak.castShadow = true;
            player.add(beak);
            
            // Eyes (two tiny black dots)
            const eyeGeometry = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const eyeLeft = new THREE.Mesh(eyeGeometry, blackMaterial);
            eyeLeft.position.set(-0.12, 0.72, 0.25);
            player.add(eyeLeft);
            
            const eyeRight = new THREE.Mesh(eyeGeometry, blackMaterial);
            eyeRight.position.set(0.12, 0.72, 0.25);
            player.add(eyeRight);
            
            // Wing (orange/pink box on the side)
            const wingGeometry = new THREE.BoxGeometry(0.15, 0.3, 0.4);
            const wing = new THREE.Mesh(wingGeometry, magentaMaterial);
            wing.position.set(0.35, 0.35, 0);
            wing.castShadow = true;
            player.add(wing);
            
            // Legs (two thin orange boxes underneath)
            const legGeometry = new THREE.BoxGeometry(0.12, 0.25, 0.12);
            const legLeft = new THREE.Mesh(legGeometry, orangeMaterial);
            legLeft.position.set(-0.15, 0.0, 0.1);
            legLeft.castShadow = true;
            player.add(legLeft);
            
            const legRight = new THREE.Mesh(legGeometry, orangeMaterial);
            legRight.position.set(0.15, 0.0, 0.1);
            legRight.castShadow = true;
            player.add(legRight);
            
            // Feet (flat orange boxes at the bottom)
            const footGeometry = new THREE.BoxGeometry(0.15, 0.08, 0.25);
            const footLeft = new THREE.Mesh(footGeometry, orangeMaterial);
            footLeft.position.set(-0.15, -0.1, 0.15);
            footLeft.castShadow = true;
            player.add(footLeft);
            
            const footRight = new THREE.Mesh(footGeometry, orangeMaterial);
            footRight.position.set(0.15, -0.1, 0.15);
            footRight.castShadow = true;
            player.add(footRight);
            
            // Position the entire chicken group
            player.position.set(0, 0.4, 0);
            scene.add(player);
        }

        function generateLane(zPos) {
            // Check if lane already exists
            if (lanes.find(l => l.z === zPos)) return;

            let laneType;
            const rand = Math.random();
            
            // Starting area is always grass
            if (zPos >= -2 && zPos <= 2) {
                laneType = LANE_TYPES.GRASS;
            } else if (rand < 0.4) {
                laneType = LANE_TYPES.GRASS;
            } else if (rand < 0.7) {
                laneType = LANE_TYPES.ROAD;
            } else {
                laneType = LANE_TYPES.RIVER;
            }

            const lane = {
                z: zPos,
                type: laneType,
                meshes: []
            };

            // Create lane ground
            const laneGeometry = new THREE.BoxGeometry(30, 0.5, LANE_WIDTH);
            let laneMaterial;
            
            if (laneType === LANE_TYPES.GRASS) {
                laneMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            } else if (laneType === LANE_TYPES.ROAD) {
                laneMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
            } else {
                laneMaterial = new THREE.MeshLambertMaterial({ color: 0x4169E1 });
            }

            const laneMesh = new THREE.Mesh(laneGeometry, laneMaterial);
            laneMesh.position.set(0, -0.25, zPos);
            laneMesh.receiveShadow = true;
            scene.add(laneMesh);
            lane.meshes.push(laneMesh);

            // Add obstacles
            if (laneType === LANE_TYPES.ROAD) {
                createCars(lane);
            } else if (laneType === LANE_TYPES.RIVER) {
                createLogs(lane);
            } else if (laneType === LANE_TYPES.GRASS) {
                // Add trees sparsely on grass lanes (avoid starting area)
                if (Math.abs(zPos) > 4 && Math.random() < 0.375) {
                    createTree(lane);
                }
            }

            lanes.push(lane);
        }

        function createCars(lane) {
            const numCars = Math.floor(Math.random() * 2) + 1;
            const direction = Math.random() > 0.5 ? 1 : -1;
            const speed = (Math.random() * 0.02 + 0.02) * direction;
            const carSpacing = 30 / numCars;

            for (let i = 0; i < numCars; i++) {
                const carColor = [0xff0000, 0xffff00, 0xff00ff, 0x00ffff][Math.floor(Math.random() * 4)];
                const carMaterial = new THREE.MeshLambertMaterial({ color: carColor });
                
                // Create car as a group of boxes
                const carGroup = new THREE.Group();
                
                // Main body (lower, wider part)
                const bodyGeometry = new THREE.BoxGeometry(1.2, 0.5, 1.8);
                const body = new THREE.Mesh(bodyGeometry, carMaterial);
                body.position.set(0, 0.25, 0);
                body.castShadow = true;
                carGroup.add(body);
                
                // Cabin/roof (upper, smaller part)
                const cabinGeometry = new THREE.BoxGeometry(1.0, 0.5, 1.0);
                const cabin = new THREE.Mesh(cabinGeometry, carMaterial);
                cabin.position.set(0, 0.65, 0);
                cabin.castShadow = true;
                carGroup.add(cabin);
                
                carGroup.position.set(
                    -15 + i * carSpacing + Math.random() * 8,
                    0,
                    lane.z
                );
                scene.add(carGroup);

                obstacles.push({
                    mesh: carGroup,
                    type: 'car',
                    speed: speed,
                    lane: lane.z
                });
            }
        }

        function createLogs(lane) {
            const numLogs = Math.floor(Math.random() * 2) + 2;
            const direction = Math.random() > 0.5 ? 1 : -1;
            const speed = (Math.random() * 0.015 + 0.01) * direction;
            const logSpacing = 30 / numLogs;

            for (let i = 0; i < numLogs; i++) {
                const logLength = Math.random() * 2 + 2;
                const logGeometry = new THREE.BoxGeometry(logLength, 0.5, 1.5);
                const logMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const log = new THREE.Mesh(logGeometry, logMaterial);
                
                log.position.set(
                    -15 + i * logSpacing + Math.random() * 5,
                    0.15,
                    lane.z
                );
                log.castShadow = true;
                scene.add(log);

                obstacles.push({
                    mesh: log,
                    type: 'log',
                    speed: speed,
                    lane: lane.z,
                    length: logLength
                });
            }
        }

        function createTree(lane) {
            const treeGroup = new THREE.Group();
            
            // Trunk
            const trunkGeometry = new THREE.BoxGeometry(0.3, 1.2, 0.3);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(0, 0.6, 0);
            trunk.castShadow = true;
            treeGroup.add(trunk);
            
            // Foliage (use box for consistency with low-poly style)
            const foliageGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const foliageMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
            foliage.position.set(0, 1.5, 0);
            foliage.castShadow = true;
            treeGroup.add(foliage);
            
            // Position tree at random x within the lane
            const xPos = (Math.random() - 0.5) * 16; // Keep away from edges
            treeGroup.position.set(xPos, 0, lane.z);
            scene.add(treeGroup);
            
            // Add to lane meshes for cleanup
            lane.meshes.push(treeGroup);
            
            // Store tree position for collision detection
            trees.push({ x: xPos, z: lane.z });
        }

        function onKeyDown(event) {
            if (!gameActive || isMoving) return;

            const key = event.key.toLowerCase();
            let dx = 0, dz = 0;

            if (key === 'arrowup' || key === 'w') {
                dz = GRID_SIZE;
            } else if (key === 'arrowdown' || key === 's') {
                dz = -GRID_SIZE;
            } else if (key === 'arrowleft' || key === 'a') {
                dx = GRID_SIZE;
            } else if (key === 'arrowright' || key === 'd') {
                dx = -GRID_SIZE;
            } else {
                return;
            }

            startMove(dx, dz);
        }

        function startMove(dx, dz) {
            moveStart.x = player.position.x;
            moveStart.y = player.position.y;
            moveStart.z = player.position.z;
            
            let newX = player.position.x + dx;
            let newZ = player.position.z + dz;
            
            // Limit side movement
            newX = Math.max(-12, Math.min(12, newX));
            
            // Check for tree collision at destination
            for (let tree of trees) {
                const distX = Math.abs(newX - tree.x);
                const distZ = Math.abs(newZ - tree.z);
                
                // If destination is too close to a tree, cancel the move
                if (distX < 1.0 && distZ < 1.0) {
                    return; // Block the move
                }
            }
            
            // Move is valid, proceed
            isMoving = true;
            moveProgress = 0;
            moveEnd.x = newX;
            moveEnd.y = 0.4;
            moveEnd.z = newZ;
            ridingLog = null;
        }

        function updatePlayer(delta) {
            if (isMoving) {
                moveProgress += delta / MOVE_DURATION;

                if (moveProgress >= 1) {
                    moveProgress = 1;
                    isMoving = false;

                    // Update score (use the snapped target, not the mid-hop position)
                    if (moveEnd.z > maxZ) {
                        maxZ = moveEnd.z;
                        score = Math.round(maxZ / GRID_SIZE);
                        document.getElementById('score').textContent = score;
                    }
                }

                // Smooth movement with hop
                const t = moveProgress;
                player.position.x = moveStart.x + (moveEnd.x - moveStart.x) * t;
                player.position.z = moveStart.z + (moveEnd.z - moveStart.z) * t;
                
                // Hop animation (parabolic arc)
                const hopProgress = Math.sin(t * Math.PI);
                player.position.y = moveEnd.y + hopProgress * HOP_HEIGHT;

                if (!isMoving) {
                    generateLanesAhead();
                    cleanupOldLanes();
                }
            } else if (ridingLog) {
                // Move with the log
                player.position.x += ridingLog.speed;
                
                // Check if player fell off the log
                if (Math.abs(player.position.x) > 10) {
                    gameOver();
                }
            }
        }

        function updateObstacles() {
            obstacles.forEach(obstacle => {
                obstacle.mesh.position.x += obstacle.speed;

                // Wrap around
                if (obstacle.mesh.position.x > 20) {
                    obstacle.mesh.position.x = -20;
                } else if (obstacle.mesh.position.x < -20) {
                    obstacle.mesh.position.x = 20;
                }
            });
        }

        function checkCollision() {
            const playerLaneZ = Math.round(player.position.z / LANE_WIDTH) * LANE_WIDTH;
            const currentLane = lanes.find(l => Math.abs(l.z - playerLaneZ) < 0.1);

            if (!currentLane) return;

            if (currentLane.type === LANE_TYPES.ROAD) {
                // Check car collision every frame (even during hop)
                const carsInLane = obstacles.filter(o => o.type === 'car' && Math.abs(o.lane - playerLaneZ) < 0.1);
                
                for (let car of carsInLane) {
                    const dx = Math.abs(player.position.x - car.mesh.position.x);
                    const dz = Math.abs(player.position.z - car.mesh.position.z);
                    
                    if (dx < 1 && dz < 1) {
                        gameOver();
                        return;
                    }
                }
            } else if (currentLane.type === LANE_TYPES.RIVER && !isMoving) {
                // Only check river/log logic when player has landed (not mid-hop)
                const logsInLane = obstacles.filter(o => o.type === 'log' && Math.abs(o.lane - playerLaneZ) < 0.1);
                let onLog = false;

                for (let log of logsInLane) {
                    const dx = Math.abs(player.position.x - log.mesh.position.x);
                    const dz = Math.abs(player.position.z - log.mesh.position.z);
                    
                    if (dx < log.length / 2 + 0.4 && dz < 1) {
                        onLog = true;
                        ridingLog = log;
                        break;
                    }
                }

                if (!onLog) {
                    gameOver();
                }
            }
        }

        function generateLanesAhead() {
            const furthestZ = player.position.z + VIEW_DISTANCE;
            const startZ = Math.floor(furthestZ / LANE_WIDTH) * LANE_WIDTH;

            for (let z = startZ - 10; z <= startZ + 10; z += LANE_WIDTH) {
                generateLane(z);
            }
        }

        function cleanupOldLanes() {
            const minZ = player.position.z - VIEW_DISTANCE;

            lanes = lanes.filter(lane => {
                if (lane.z < minZ) {
                    // Remove lane meshes
                    lane.meshes.forEach(mesh => scene.remove(mesh));
                    
                    // Remove obstacles in this lane
                    obstacles = obstacles.filter(obstacle => {
                        if (Math.abs(obstacle.lane - lane.z) < 0.1) {
                            scene.remove(obstacle.mesh);
                            return false;
                        }
                        return true;
                    });
                    
                    // Remove trees in this lane
                    trees = trees.filter(tree => Math.abs(tree.z - lane.z) >= 0.1);
                    
                    return false;
                }
                return true;
            });
        }

        function updateCamera() {
            // Smooth camera follow
            const targetZ = player.position.z - CAMERA_OFFSET;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            camera.lookAt(0, 0, player.position.z);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            // Reset game state
            gameActive = true;
            score = 0;
            maxZ = 0;
            isMoving = false;
            ridingLog = null;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';

            // Reset player
            player.position.set(0, 0.4, 0);

            // Clear obstacles
            obstacles.forEach(obstacle => scene.remove(obstacle.mesh));
            obstacles = [];

            // Clear lanes
            lanes.forEach(lane => {
                lane.meshes.forEach(mesh => scene.remove(mesh));
            });
            lanes = [];
            
            // Clear trees
            trees = [];

            // Reset camera
            camera.position.set(-15, 15, -15);

            // Regenerate initial lanes
            for (let z = -10; z <= 10; z++) {
                generateLane(z * LANE_WIDTH);
            }
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const viewSize = 8;
            camera.left = -viewSize * aspect;
            camera.right = viewSize * aspect;
            camera.top = viewSize;
            camera.bottom = -viewSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        let lastTime = 0;
        function animate(currentTime = 0) {
            requestAnimationFrame(animate);

            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            if (gameActive) {
                updatePlayer(delta);
                updateObstacles();
                checkCollision();
                updateCamera();
            }

            renderer.render(scene, camera);
        }

        // Start the game
        init();
    </script>
</body>
</html>
